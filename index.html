<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>weekendup.date</title>
  <meta name="description" content="weekendup.date">
  <meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0eb;
      --muted: #8d8d88;
      --line: #30302e;
      --accent: #ff3fa4;
      --ticker: #ffb3d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 72px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      margin: 0;
      font-weight: 800;
    }

    h1 span {
      display: block;
    }

    h1 .date {
      color: var(--accent);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 28px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .description {
      max-width: 500px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #c5c4bf;
    }

    .description strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    footer {
      margin-top: 100px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /*
      --------------------------------------------------
      BACKGROUND STOCK TICKER
      --------------------------------------------------
    */

    .ticker-background {
      position: fixed;
      right: -20px;
      bottom: -10px;

      width: min(440px, 46vw);
      height: 300px;

      pointer-events: none;
      z-index: 1;

      /*
        The ticker is intentionally subtle.
        The individual rows control their own opacity.
      */

      overflow: hidden;

      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );
    }

    .ticker-list {
      position: absolute;
      right: 0;
      bottom: 0;

      width: 100%;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 7px;
    }

    .ticker-row {
      width: 100%;

      display: grid;
      grid-template-columns: 70px 90px 82px 1fr;
      align-items: center;

      gap: 12px;

      padding: 4px 20px 4px 18px;

      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;

      color: var(--ticker);

      white-space: nowrap;

      transform: translateY(0);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    .ticker-symbol {
      color: var(--ticker);
    }

    .ticker-price {
      text-align: right;
    }

    .ticker-change {
      text-align: right;
    }

    .ticker-change.up {
      color: var(--accent);
    }

    .ticker-change.down {
      color: var(--ticker);
    }

    .ticker-volume {
      text-align: right;
      color: var(--ticker);
      opacity: 0.75;
    }

    /*
      New rows enter from below and gently settle
      into their final position.
    */

    .ticker-row.entering {
      opacity: 0;
      transform: translateY(18px);
    }

    .ticker-row.visible {
      transform: translateY(0);
    }

    /*
      Different opacity levels create the fading
      top-to-bottom / bottom-to-top depth effect.
    */

    .ticker-row:nth-child(1) {
      opacity: 0.10;
    }

    .ticker-row:nth-child(2) {
      opacity: 0.20;
    }

    .ticker-row:nth-child(3) {
      opacity: 0.30;
    }

    .ticker-row:nth-child(4) {
      opacity: 0.40;
    }

    .ticker-row:nth-child(5) {
      opacity: 0.50;
    }

    .ticker-row:nth-child(6) {
      opacity: 0.40;
    }

    .ticker-row:nth-child(7) {
      opacity: 0.20;
    }

    .ticker-row:nth-child(8) {
      opacity: 0.10;
    }

    /*
      --------------------------------------------------
      MOBILE
      --------------------------------------------------
    */

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .topline {
        margin-bottom: 52px;
      }

      .bottom {
        flex-direction: column;
        gap: 24px;
      }

      .note {
        text-align: left;
        white-space: normal;
      }

      footer {
        margin-top: 70px;
      }

      .ticker-background {
        width: 90vw;
        height: 250px;
        right: -30px;
        bottom: -10px;
      }

      .ticker-row {
        grid-template-columns: 58px 72px 70px 1fr;
        gap: 8px;
        padding-right: 12px;
        font-size: 9px;
      }
    }

    /*
      Respect reduced-motion preferences.
    */

    @media (prefers-reduced-motion: reduce) {
      .ticker-row {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!--
    Fictional background stock ticker.
    All values are generated locally and are not real market data.
  -->

  <div class="ticker-background" aria-hidden="true">
    <div class="ticker-list" id="tickerList"></div>
  </div>

  <main>

    <div class="topline">
      <div>weekendup.date</div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <h1>
      Weekend
      <span class="date">Up.date</span>
    </h1>

    <div class="rule"></div>

    <div class="bottom">

      <div class="description">
        A small corner of the internet for
        <strong>email, assorted projects, and things
        that don't need a homepage.</strong>
      </div>

      <div class="note">
        No breaking news.<br>
        No particular reason.
      </div>

    </div>

    <footer>
      <div>Established 2026</div>
      <div>weekendup.date</div>
    </footer>

  </main>

  <script>
    /*
      --------------------------------------------------
      FICTIONAL STOCK TICKER GENERATOR
      --------------------------------------------------

      These symbols and values are completely fictional.
      Nothing is fetched from an external source.
    */

    const tickerList = document.getElementById("tickerList");

    const symbols = [
      "WKND",
      "UPDT",
      "SATX",
      "FRDY",
      "NITE",
      "WEEK",
      "SUND",
      "MORN",
      "STDB",
      "OFFC",
      "REST",
      "BRCH",
      "PLAZ",
      "TZZY",
      "SNCK",
      "DWN",
      "IDLL",
      "HRSY",
      "BRLL",
      "KID"
    ];

    const initialTickers = 8;
    const maximumTickers = 8;

    /*
      Generate a fictional price.
    */

    function generatePrice() {
      const price = Math.random() * 490 + 10;
      return price.toFixed(2);
    }

    /*
      Generate a fictional percentage movement.
    */

    function generateChange() {
      const positive = Math.random() > 0.45;
      const amount = Math.random() * 7 + 0.05;
      const value = amount.toFixed(2);

      return {
        value: positive ? `+${value}%` : `-${value}%`,
        direction: positive ? "up" : "down"
      };
    }

    /*
      Generate a fictional trading volume.
    */

    function generateVolume() {
      const volume = Math.floor(Math.random() * 980 + 20);
      return `${volume}K`;
    }

    /*
      Create one ticker row.
    */

    function createTicker() {
      const row = document.createElement("div");

      row.className = "ticker-row entering";

      const symbol = symbols[
        Math.floor(Math.random() * symbols.length)
      ];

      const change = generateChange();

      row.innerHTML = `
        <span class="ticker-symbol">${symbol}</span>
        <span class="ticker-price">$${generatePrice()}</span>
        <span class="ticker-change ${change.direction}">
          ${change.value}
        </span>
        <span class="ticker-volume">
          VOL ${generateVolume()}
        </span>
      `;

      return row;
    }

    /*
      Add a new ticker to the bottom.
    */

    function addTicker() {
      const row = createTicker();

      tickerList.appendChild(row);

      /*
        Allow the browser to render the entering state
        before transitioning into the visible state.
      */

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          row.classList.remove("entering");
          row.classList.add("visible");
        });
      });

      /*
        Remove the oldest ticker once we exceed
        the maximum number of visible rows.
      */

      while (tickerList.children.length > maximumTickers) {
        const oldest = tickerList.firstElementChild;

        oldest.style.opacity = "0";
        oldest.style.transform = "translateY(-14px)";

        setTimeout(() => {
          if (oldest.parentNode === tickerList) {
            oldest.remove();
          }
        }, 1200);

        break;
      }
    }

    /*
      Fill the ticker immediately when the page loads.
    */

    for (let i = 0; i < initialTickers; i++) {
      const row = createTicker();

      row.classList.remove("entering");
      row.classList.add("visible");

      tickerList.appendChild(row);
    }

    /*
      Add new entries at a random interval between
      1 and 4 seconds.
    */

    function scheduleNextTicker() {
      const delay =
        Math.floor(Math.random() * 3000) + 1000;

      setTimeout(() => {
        addTicker();
        scheduleNextTicker();
      }, delay);
    }

    scheduleNextTicker();
  </script>

</body>
</html>
