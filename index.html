<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>weekendup.date</title>
  <meta name="description" content="weekendup.date">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0eb;
      --muted: #8d8d88;
      --line: #30302e;
      --accent: #ff3fa4;
      --globe: #ffb3d8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 72px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      margin: 0;
      font-weight: 800;
    }

    h1 span {
      display: block;
    }

    h1 .date {
      color: var(--accent);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 28px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .description {
      max-width: 500px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #c5c4bf;
    }

    .description strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    footer {
      margin-top: 100px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Wireframe globe */

    .globe {
      position: fixed;
      width: min(58vw, 700px);
      height: min(58vw, 700px);
      right: -140px;
      bottom: -150px;
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
      animation: globeRotate 60s linear infinite;
      transform-origin: center center;
    }

    .globe svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: var(--globe);
      stroke-width: 0.75;
    }

    @keyframes globeRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .topline {
        margin-bottom: 52px;
      }

      .bottom {
        flex-direction: column;
        gap: 24px;
      }

      .note {
        text-align: left;
        white-space: normal;
      }

      footer {
        margin-top: 70px;
      }

      .globe {
        width: 115vw;
        height: 115vw;
        right: -45vw;
        bottom: -25vw;
        opacity: 0.10;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .globe {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- Wireframe globe -->
  <div class="globe" aria-hidden="true">
    <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

      <!-- Outer sphere -->
      <circle cx="250" cy="250" r="205" />

      <!-- Longitude lines -->
      <ellipse cx="250" cy="250" rx="55" ry="205" />
      <ellipse cx="250" cy="250" rx="105" ry="205" />
      <ellipse cx="250" cy="250" rx="155" ry="205" />

      <!-- Latitude lines -->
      <ellipse cx="250" cy="250" rx="205" ry="55" />
      <ellipse cx="250" cy="250" rx="205" ry="105" />
      <ellipse cx="250" cy="250" rx="205" ry="155" />

      <!-- Equator -->
      <line x1="45" y1="250" x2="455" y2="250" />

      <!-- Prime meridian -->
      <line x1="250" y1="45" x2="250" y2="455" />

    </svg>
  </div>

  <main>

    <div class="topline">
      <div>weekendup.date</div>
      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <h1>
      Weekend
      <span class="date">Up.date</span>
    </h1>

    <div class="rule"></div>

    <div class="bottom">
      <div class="description">
        A small corner of the internet for
        <strong>email, assorted projects, and things
        that don't need a homepage.</strong>
      </div>

      <div class="note">
        No breaking news.<br>
        No particular reason.
      </div>
    </div>

    <footer>
      <div>Established 2026</div>
      <div>weekendup.date</div>
    </footer>

  </main>

</body>
</html>
