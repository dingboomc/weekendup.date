<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>weekendup.date</title>
  <meta name="description" content="weekendup.date">
  <meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0eb;
      --muted: #8d8d88;
      --line: #30302e;
      --accent: #ff3fa4;

      /* Ticker colors */
      --ticker-positive: #ffb3d8;
      --ticker-negative: #c42f78;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 72px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;

      animation: statusPulse 3.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    h1 {
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      margin: 0;
      font-weight: 800;
    }

    h1 span {
      display: block;
    }

    h1 .date {
      color: var(--accent);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 28px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .description {
      max-width: 500px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #c5c4bf;
    }

    .description strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    footer {
      margin-top: 100px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /*
      --------------------------------------------------
      BACKGROUND STOCK TICKER
      --------------------------------------------------
    */

    .ticker-background {
      position: fixed;
      right: -20px;
      bottom: -10px;

      width: min(440px, 46vw);
      height: 300px;

      pointer-events: none;
      z-index: 1;

      overflow: hidden;

      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );
    }

    /*
      The ticker track is now fixed to the bottom.
      Rows are positioned individually rather than
      translating the entire flex container.
    */

    .ticker-list {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 280px;
    }

    .ticker-row {
      position: absolute;
      right: 0;

      width: 100%;
      height: 24px;

      display: grid;
      grid-template-columns: 62px 78px 70px;

      justify-content: end;
      align-items: center;

      gap: 10px;

      padding: 4px 20px 4px 18px;

      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;

      white-space: nowrap;

      /*
        Each row gets its opacity from JavaScript.
      */

      opacity: 0;

      /*
        The only animation is movement between
        fixed vertical positions and opacity.
      */

      transition:
        top 1.1s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 1.1s ease;
    }

    .ticker-symbol {
      color: var(--ticker-positive);
      text-align: left;
    }

    .ticker-price {
      color: var(--ticker-positive);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ticker-change {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /*
      Positive movements = lighter pink.
    */

    .ticker-change.up {
      color: var(--ticker-positive);
    }

    /*
      Negative movements = darker pink.
    */

    .ticker-change.down {
      color: var(--ticker-negative);
    }

    /*
      New ticker starts just below the visible area.
    */

    .ticker-row.entering {
      opacity: 0 !important;
    }

    /*
      Outgoing ticker fades away.
    */

    .ticker-row.leaving {
      opacity: 0 !important;
    }

    /*
      --------------------------------------------------
      MOBILE
      --------------------------------------------------
    */

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .topline {
        margin-bottom: 52px;
      }

      .bottom {
        flex-direction: column;
        gap: 24px;
      }

      .note {
        text-align: left;
        white-space: normal;
      }

      footer {
        margin-top: 70px;
      }

      .ticker-background {
        width: 90vw;
        height: 250px;
        right: -30px;
        bottom: -10px;
      }

      .ticker-list {
        height: 230px;
      }

      .ticker-row {
        grid-template-columns: 54px 70px 64px;
        gap: 7px;
        padding-right: 12px;
        font-size: 9px;
      }
    }

    /*
      Respect reduced-motion preferences.
    */

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }

      .ticker-row {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!--
    Fictional background stock ticker.
    All symbols and values are generated locally
    and are not real market data.
  -->

  <div class="ticker-background" aria-hidden="true">
    <div class="ticker-list" id="tickerList"></div>
  </div>

  <main>

    <div class="topline">
      <div>weekendup.date</div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <h1>
      Weekend
      <span class="date">Up.date</span>
    </h1>

    <div class="rule"></div>

    <div class="bottom">

      <div class="description">
        A small corner of the internet for
        <strong>email, assorted projects, and things
        that don't need a homepage.</strong>
      </div>

      <div class="note">
        No breaking news.<br>
        No particular reason.
      </div>

    </div>

    <footer>
      <div>Established 2026</div>
    </footer>

  </main>

  <script>
    /*
      --------------------------------------------------
      FICTIONAL STOCK TICKER GENERATOR
      --------------------------------------------------

      These symbols and values are completely fictional.
      Nothing is fetched from an external source.
    */

    const tickerList = document.getElementById("tickerList");

    const symbols = [
      "MVWK",
      "MVR",
      "FRHJ",
      "KWN",
      "NKVL",
      "WEEK",
      "JHFW",
      "VJFK",
      "JKV",
      "STDB",
      "FNRY",
      "HJMV",
      "WFR",
      "VJM",
      "KFWL",
      "DDWN",
      "IDLL",
      "HNK",
      "VIIB",
      "KID"
    ];

    const maximumTickers = 8;

    /*
      Vertical spacing between ticker rows.
    */

    const rowHeight = 31;

    /*
      Opacity levels from top to bottom.

      10% → 20% → 30% → 40%
      → 50% → 40% → 20% → 10%
    */

    const opacityLevels = [
      0.10,
      0.20,
      0.30,
      0.40,
      0.50,
      0.40,
      0.20,
      0.10
    ];

    /*
      Generate a fictional price.
    */

    function generatePrice() {
      const price = Math.random() * 490 + 10;
      return price.toFixed(2);
    }

    /*
      Generate a fictional percentage movement.
    */

    function generateChange() {
      const positive = Math.random() > 0.45;
      const amount = Math.random() * 7 + 0.05;
      const value = amount.toFixed(2);

      return {
        value: positive ? `+${value}%` : `-${value}%`,
        direction: positive ? "up" : "down"
      };
    }

    /*
      Get all ticker rows currently in the list.
    */

    function getRows() {
      return Array.from(
        tickerList.querySelectorAll(".ticker-row")
      );
    }

    /*
      Return symbols currently on screen.
    */

    function getVisibleSymbols() {
      return getRows()
        .filter(row => !row.classList.contains("leaving"))
        .map(row => row.dataset.symbol);
    }

    /*
      Pick a symbol that isn't currently visible.
    */

    function getUniqueSymbol() {
      const visibleSymbols = getVisibleSymbols();

      const availableSymbols = symbols.filter(
        symbol => !visibleSymbols.includes(symbol)
      );

      if (availableSymbols.length === 0) {
        return null;
      }

      return availableSymbols[
        Math.floor(
          Math.random() * availableSymbols.length
        )
      ];
    }

    /*
      Create a ticker row.
    */

    function createTicker() {
      const symbol = getUniqueSymbol();

      if (!symbol) {
        return null;
      }

      const row = document.createElement("div");

      row.className = "ticker-row entering";

      row.dataset.symbol = symbol;

      const change = generateChange();

      row.innerHTML = `
        <span class="ticker-symbol">
          ${symbol}
        </span>

        <span class="ticker-price">
          $${generatePrice()}
        </span>

        <span class="ticker-change ${change.direction}">
          ${change.value}
        </span>
      `;

      return row;
    }

    /*
      Position all active rows according to their
      current position in the ticker.

      Position 0 = highest
      Position 7 = lowest
    */

    function positionRows() {
      const rows = getRows()
        .filter(row => !row.classList.contains("leaving"));

      rows.forEach((row, index) => {

        /*
          Rows are anchored from the bottom.

          This means the newest ticker is always
          the bottommost row.
        */

        const bottomPosition =
          (rows.length - 1 - index) * rowHeight;

        row.style.top = "auto";
        row.style.bottom = `${bottomPosition}px`;

        row.style.opacity =
          opacityLevels[index] !== undefined
            ? opacityLevels[index]
            : 0.10;
      });
    }

    /*
      Add the initial ticker rows.
    */

    function initializeTickers() {

      for (let i = 0; i < maximumTickers; i++) {

        const row = createTicker();

        if (row) {
          row.classList.remove("entering");
          tickerList.appendChild(row);
        }
      }

      positionRows();
    }

    /*
      Add one new ticker.

      Existing rows move upward one position.
      The new ticker becomes the bottommost row.
    */

    function addTicker() {

      const row = createTicker();

      /*
        Don't add anything if no unique symbol
        is available.
      */

      if (!row) {
        return;
      }

      /*
        Add the new ticker to the DOM.
      */

      tickerList.appendChild(row);

      /*
        Find all currently active rows.
      */

      const rows = getRows()
        .filter(currentRow =>
          !currentRow.classList.contains("leaving")
        );

      /*
        If we now have more than 8 rows, the oldest
        one is removed from the visual stack.
      */

      if (rows.length > maximumTickers) {

        const oldest = rows[0];

        oldest.classList.add("leaving");

        /*
          The leaving row is allowed to fade out,
          but it is no longer included in positioning.
        */

        setTimeout(() => {

          if (oldest.parentNode === tickerList) {
            oldest.remove();
          }

        }, 1150);
      }

      /*
        Position the remaining rows.

        Because every row has an explicit bottom
        position, there is no container translation
        and therefore no reset/bounce.
      */

      requestAnimationFrame(() => {
        positionRows();

        /*
          The new row starts at the bottommost
          opacity level rather than appearing bright.
        */

        row.classList.remove("entering");
      });
    }

    /*
      Start the ticker.
    */

    initializeTickers();

    /*
      Add new entries at a random interval
      between 1 and 4 seconds.
    */

    function scheduleNextTicker() {

      const delay =
        Math.floor(Math.random() * 3000) + 1000;

      setTimeout(() => {

        addTicker();

        scheduleNextTicker();

      }, delay);
    }

    scheduleNextTicker();
  </script>

</body>
</html>
