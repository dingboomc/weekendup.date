<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>weekendup.date</title>
  <meta name="description" content="weekendup.date">
  <meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0eb;
      --muted: #8d8d88;
      --line: #30302e;
      --accent: #ff3fa4;

      /* Ticker colors */
      --ticker-positive: #ffb3d8;
      --ticker-negative: #c42f78;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 72px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;

      /*
        Subtle slow pulse between full opacity
        and 50% opacity.
      */
      animation: statusPulse 3.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    h1 {
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      margin: 0;
      font-weight: 800;
    }

    h1 span {
      display: block;
    }

    h1 .date {
      color: var(--accent);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 28px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .description {
      max-width: 500px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #c5c4bf;
    }

    .description strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    footer {
      margin-top: 100px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /*
      --------------------------------------------------
      BACKGROUND STOCK TICKER
      --------------------------------------------------
    */

    .ticker-background {
      position: fixed;
      right: -20px;
      bottom: -10px;

      width: min(440px, 46vw);
      height: 300px;

      pointer-events: none;
      z-index: 1;

      overflow: hidden;

      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );
    }

    /*
      The list itself is the only thing that moves.
      Individual rows no longer have their own vertical
      animation, preventing the bouncing effect.
    */

    .ticker-list {
      position: absolute;
      right: 0;
      bottom: 0;

      width: 100%;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 7px;

      transform: translateY(0);

      transition: transform 1.1s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .ticker-row {
      width: 100%;

      display: grid;
      grid-template-columns: 62px 78px 70px;

      justify-content: end;
      align-items: center;

      gap: 10px;

      padding: 4px 20px 4px 18px;

      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;

      white-space: nowrap;

      /*
        Opacity is controlled entirely by JavaScript.
      */
      opacity: 0.1;

      /*
        Only opacity transitions here.
        No row movement.
      */
      transition: opacity 1.1s ease;
    }

    .ticker-symbol {
      color: var(--ticker-positive);
      text-align: left;
    }

    .ticker-price {
      color: var(--ticker-positive);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ticker-change {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /*
      Positive movements = lighter pink.
    */

    .ticker-change.up {
      color: var(--ticker-positive);
    }

    /*
      Negative movements = darker pink.
    */

    .ticker-change.down {
      color: var(--ticker-negative);
    }

    /*
      --------------------------------------------------
      MOBILE
      --------------------------------------------------
    */

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .topline {
        margin-bottom: 52px;
      }

      .bottom {
        flex-direction: column;
        gap: 24px;
      }

      .note {
        text-align: left;
        white-space: normal;
      }

      footer {
        margin-top: 70px;
      }

      .ticker-background {
        width: 90vw;
        height: 250px;
        right: -30px;
        bottom: -10px;
      }

      .ticker-row {
        grid-template-columns: 54px 70px 64px;
        gap: 7px;
        padding-right: 12px;
        font-size: 9px;
      }
    }

    /*
      Respect reduced-motion preferences.
    */

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }

      .ticker-list {
        transition: none;
      }

      .ticker-row {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!--
    Fictional background stock ticker.
    All symbols and values are generated locally
    and are not real market data.
  -->

  <div class="ticker-background" aria-hidden="true">
    <div class="ticker-list" id="tickerList"></div>
  </div>

  <main>

    <div class="topline">
      <div>weekendup.date</div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <h1>
      Weekend
      <span class="date">Up.date</span>
    </h1>

    <div class="rule"></div>

    <div class="bottom">

      <div class="description">
        A small corner of the internet for
        <strong>email, assorted projects, and things
        that don't need a homepage.</strong>
      </div>

      <div class="note">
        No breaking news.<br>
        No particular reason.
      </div>

    </div>

    <footer>
      <div>Established 2026</div>
    </footer>

  </main>

  <script>
    /*
      --------------------------------------------------
      FICTIONAL STOCK TICKER GENERATOR
      --------------------------------------------------

      These symbols and values are completely fictional.
      Nothing is fetched from an external source.
    */

    const tickerList = document.getElementById("tickerList");

    const symbols = [
      "MVWK",
      "MVR",
      "FRHJ",
      "KWN",
      "NKVL",
      "WEEK",
      "JHFW",
      "VJFK",
      "JKV",
      "STDB",
      "FNRY",
      "HJMV",
      "WFR",
      "VJM",
      "KFWL",
      "DDWN",
      "IDLL",
      "HNK",
      "VIIB",
      "KID"
    ];

    const initialTickers = 8;
    const maximumTickers = 8;

    /*
      Opacity levels from top to bottom.

      10% → 20% → 30% → 40%
      → 50% → 40% → 20% → 10%
    */

    const opacityLevels = [
      0.10,
      0.20,
      0.30,
      0.40,
      0.50,
      0.40,
      0.20,
      0.10
    ];

    /*
      Generate a fictional price.
    */

    function generatePrice() {
      const price = Math.random() * 490 + 10;
      return price.toFixed(2);
    }

    /*
      Generate a fictional percentage movement.
    */

    function generateChange() {
      const positive = Math.random() > 0.45;
      const amount = Math.random() * 7 + 0.05;
      const value = amount.toFixed(2);

      return {
        value: positive ? `+${value}%` : `-${value}%`,
        direction: positive ? "up" : "down"
      };
    }

    /*
      Apply opacity according to each row's
      current position.
    */

    function updateOpacities() {
      const rows = Array.from(
        tickerList.querySelectorAll(".ticker-row")
      );

      rows.forEach((row, index) => {
        const opacity =
          opacityLevels[index] !== undefined
            ? opacityLevels[index]
            : 0.10;

        row.style.opacity = opacity;
      });
    }

    /*
      Return the symbols currently visible.
    */

    function getVisibleSymbols() {
      return Array.from(
        tickerList.querySelectorAll(".ticker-row")
      ).map(row => row.dataset.symbol);
    }

    /*
      Pick a symbol that is NOT currently visible.

      This prevents duplicate ticker symbols from
      appearing simultaneously.
    */

    function getUniqueSymbol() {
      const visibleSymbols = getVisibleSymbols();

      const availableSymbols = symbols.filter(
        symbol => !visibleSymbols.includes(symbol)
      );

      /*
        There are enough symbols for the number of
        visible rows, but fall back safely if that
        ever changes.
      */

      if (availableSymbols.length === 0) {
        return null;
      }

      return availableSymbols[
        Math.floor(Math.random() * availableSymbols.length)
      ];
    }

    /*
      Create one ticker row.
    */

    function createTicker() {
      const symbol = getUniqueSymbol();

      /*
        If every available symbol is already on screen,
        don't create a duplicate.
      */

      if (!symbol) {
        return null;
      }

      const row = document.createElement("div");

      row.className = "ticker-row";
      row.dataset.symbol = symbol;

      const change = generateChange();

      row.innerHTML = `
        <span class="ticker-symbol">
          ${symbol}
        </span>

        <span class="ticker-price">
          $${generatePrice()}
        </span>

        <span class="ticker-change ${change.direction}">
          ${change.value}
        </span>
      `;

      return row;
    }

    /*
      Add a new ticker and smoothly push the
      existing stack upward.
    */

    function addTicker() {
      /*
        Prevent a new ticker from being added if
        there isn't an unused symbol available.
      */

      const row = createTicker();

      if (!row) {
        return;
      }

      /*
        Add the new row to the bottom.

        At this moment there are temporarily 9 rows.
      */

      tickerList.appendChild(row);

      /*
        Get the exact height of one row including
        the gap between rows.
      */

      const rowHeight =
        row.getBoundingClientRect().height + 7;

      /*
        Immediately assign the correct opacity
        levels to the new arrangement.

        The new bottom row starts at exactly 10%.
      */

      const rows = Array.from(
        tickerList.querySelectorAll(".ticker-row")
      );

      rows.forEach((currentRow, index) => {

        if (index === 0) {
          /*
            Oldest row is leaving.
          */
          currentRow.style.opacity = 0;
        } else {
          /*
            Every remaining row moves up one position.
          */
          const newIndex = index - 1;

          currentRow.style.opacity =
            opacityLevels[newIndex] !== undefined
              ? opacityLevels[newIndex]
              : 0.10;
        }
      });

      /*
        Move the entire ticker stack upward exactly
        one row height.

        No individual row gets a transform, which
        eliminates the previous bouncing effect.
      */

      requestAnimationFrame(() => {
        tickerList.style.transform =
          `translateY(-${rowHeight}px)`;
      });

      /*
        After the movement completes, remove the
        oldest row and reset the list position.

        Because the visual positions are identical
        before and after the reset, there should be
        no visible jump.
      */

      setTimeout(() => {

        const oldest = tickerList.firstElementChild;

        if (oldest) {
          oldest.remove();
        }

        tickerList.style.transition = "none";
        tickerList.style.transform = "translateY(0)";

        /*
          Re-establish the standard opacity gradient.
        */

        updateOpacities();

        /*
          Force the browser to apply the reset
          immediately rather than animating it.
        */

        void tickerList.offsetHeight;

        tickerList.style.transition = "";
      }, 1150);
    }

    /*
      Fill the ticker when the page loads.
    */

    for (let i = 0; i < initialTickers; i++) {

      const row = createTicker();

      if (row) {
        tickerList.appendChild(row);
      }
    }

    /*
      Apply the initial opacity gradient.
    */

    updateOpacities();

    /*
      Add new entries at a random interval
      between 1 and 4 seconds.
    */

    function scheduleNextTicker() {

      const delay =
        Math.floor(Math.random() * 3000) + 1000;

      setTimeout(() => {
        addTicker();
        scheduleNextTicker();
      }, delay);
    }

    scheduleNextTicker();
  </script>

</body>
</html>
