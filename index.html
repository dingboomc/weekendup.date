<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>weekendup.date</title>
  <meta name="description" content="weekendup.date">
  <meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0eb;
      --muted: #8d8d88;
      --line: #30302e;
      --accent: #ff3fa4;
      --globe: #ffb3d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      overflow: hidden;
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 2;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 72px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      margin: 0;
      font-weight: 800;
    }

    h1 span {
      display: block;
    }

    h1 .date {
      color: var(--accent);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 28px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .description {
      max-width: 500px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #c5c4bf;
    }

    .description strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    footer {
      margin-top: 100px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /*
      --------------------------------------------------
      3D WIREFRAME GLOBE
      --------------------------------------------------
    */

    .globe {
      position: fixed;
      width: min(58vw, 700px);
      height: min(58vw, 700px);
      right: -140px;
      bottom: -150px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.12;

      perspective: 1200px;
    }

    .globe-sphere {
      position: relative;
      width: 100%;
      height: 100%;

      transform-style: preserve-3d;

      animation: globeRotate 60s linear infinite;
    }

    /*
      The actual spherical outline.
    */

    .globe-outline {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58.6%;
      height: 58.6%;

      transform: translate(-50%, -50%);

      border: 0.75px solid var(--globe);
      border-radius: 50%;
    }

    /*
      Latitude rings.
      These remain fixed relative to the globe while
      the longitude rings rotate around the Y axis.
    */

    .latitude {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 58.6%;
      height: 58.6%;

      border: 0.75px solid var(--globe);
      border-radius: 50%;

      transform-origin: center center;
    }

    .latitude.north-1 {
      transform:
        translate(-50%, -50%)
        translateY(-18%)
        scaleY(0.28);
    }

    .latitude.north-2 {
      transform:
        translate(-50%, -50%)
        translateY(-10%)
        scaleY(0.68);
    }

    .latitude.south-1 {
      transform:
        translate(-50%, -50%)
        translateY(10%)
        scaleY(0.68);
    }

    .latitude.south-2 {
      transform:
        translate(-50%, -50%)
        translateY(18%)
        scaleY(0.28);
    }

    /*
      Equator.
    */

    .equator {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58.6%;
      height: 0;

      border-top: 0.75px solid var(--globe);

      transform: translate(-50%, -50%);
    }

    /*
      Longitude rings.
      
      Each ring is a circle standing vertically in 3D space.
      Rotating the sphere around Y makes these naturally
      compress and expand as they move toward/away from view.
    */

    .longitude {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 58.6%;
      height: 58.6%;

      border: 0.75px solid var(--globe);
      border-radius: 50%;

      transform-origin: center center;
    }

    .longitude-1 {
      transform:
        translate(-50%, -50%)
        rotateY(15deg);
    }

    .longitude-2 {
      transform:
        translate(-50%, -50%)
        rotateY(30deg);
    }

    .longitude-3 {
      transform:
        translate(-50%, -50%)
        rotateY(45deg);
    }

    .longitude-4 {
      transform:
        translate(-50%, -50%)
        rotateY(60deg);
    }

    .longitude-5 {
      transform:
        translate(-50%, -50%)
        rotateY(75deg);
    }

    .longitude-6 {
      transform:
        translate(-50%, -50%)
        rotateY(90deg);
    }

    .longitude-7 {
      transform:
        translate(-50%, -50%)
        rotateY(105deg);
    }

    .longitude-8 {
      transform:
        translate(-50%, -50%)
        rotateY(120deg);
    }

    .longitude-9 {
      transform:
        translate(-50%, -50%)
        rotateY(135deg);
    }

    .longitude-10 {
      transform:
        translate(-50%, -50%)
        rotateY(150deg);
    }

    .longitude-11 {
      transform:
        translate(-50%, -50%)
        rotateY(165deg);
    }

    /*
      Slow rotation around the vertical axis.
    */

    @keyframes globeRotate {
      from {
        transform: rotateY(0deg);
      }

      to {
        transform: rotateY(360deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .topline {
        margin-bottom: 52px;
      }

      .bottom {
        flex-direction: column;
        gap: 24px;
      }

      .note {
        text-align: left;
        white-space: normal;
      }

      footer {
        margin-top: 70px;
      }

      .globe {
        width: 115vw;
        height: 115vw;
        right: -45vw;
        bottom: -25vw;
        opacity: 0.10;
      }
    }

    /*
      Respect users who have requested reduced motion.
    */

    @media (prefers-reduced-motion: reduce) {
      .globe-sphere {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- 3D wireframe globe -->
  <div class="globe" aria-hidden="true">

    <div class="globe-sphere">

      <!-- Outer sphere -->
      <div class="globe-outline"></div>

      <!-- Latitude rings -->
      <div class="latitude north-1"></div>
      <div class="latitude north-2"></div>
      <div class="latitude south-1"></div>
      <div class="latitude south-2"></div>

      <!-- Equator -->
      <div class="equator"></div>

      <!-- Longitude rings -->
      <div class="longitude longitude-1"></div>
      <div class="longitude longitude-2"></div>
      <div class="longitude longitude-3"></div>
      <div class="longitude longitude-4"></div>
      <div class="longitude longitude-5"></div>
      <div class="longitude longitude-6"></div>
      <div class="longitude longitude-7"></div>
      <div class="longitude longitude-8"></div>
      <div class="longitude longitude-9"></div>
      <div class="longitude longitude-10"></div>
      <div class="longitude longitude-11"></div>

    </div>

  </div>

  <main>

    <div class="topline">
      <div>weekendup.date</div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <h1>
      Weekend
      <span class="date">Up.date</span>
    </h1>

    <div class="rule"></div>

    <div class="bottom">

      <div class="description">
        A small corner of the internet for
        <strong>email, assorted projects, and things
        that don't need a homepage.</strong>
      </div>

      <div class="note">
        No breaking news.<br>
        No particular reason.
      </div>

    </div>

    <footer>
      <div>Established 2026</div>
      <div>weekendup.date</div>
    </footer>

  </main>

</body>
</html>
